[General]
sim-time-limit = 10s

# General recording settings.
**.vector-recording = false
**.scalar-recording = false
**.param-recording = false
##abstract-config = true (requires omnet 7)
warmup-period = 2s
config-recording = none
**.cli.param-recording = true
**.statistic-recording = false
**.param-record-as-scalar = false
**.bin-recording = false
**.result-recording-modes = all#

[Config LargeNet]
network = LargeNet

LargeNet.n = 300   # number of switches on backbone

LargeNet.*s = 1   # uncomment for testing: one LAN of each type on each switch
LargeNet.*m = 1   # uncomment for testing: one LAN of each type on each switch
LargeNet.*l = 1   # uncomment for testing: one LAN of each type on each switch

LargeNet.*.n = 8 # number of hosts connected to a switch in each LAN
LargeNet.*.h = 5 # number of hosts connected to a hub in each LAN
LargeNet.*.b = 7 # number of hosts connected to a bus in each LAN

LargeNet.**.cli.reqLength = intuniform(50,1400)*1B
LargeNet.**.cli.respLength = intWithUnit(truncnormal(5000B,5000B))
LargeNet.**.cli.sendInterval = exponential(0.3s)  # avg 2 requests per sec

# Measured end-to-end latency.
LargeNet.llanBB[0].host[0].cli.destAddress = "serverA"
LargeNet.llanBB[1..9].*.cli.destAddress = "serverC" # Remove comment for skipping line update: Remaining traffic

# Specified recording settings for hosts.
#LargeNet.llanBB[0].host[0].**.vector-recording = true
#LargeNet.llanBB[0].host[0].**.bin-recording = true
LargeNet.llanBB[0].host[0].**.scalar-recording = true
LargeNet.llanBB[0].host[0].**.statistic-recording = true

# Specified recording settings for backbone switches.
**.channel.cost.param-recording = true
**.channel.datarate.param-recording = true

**.switch*.bridging.typename = "MacRelayUnit"

# Parameter tuning for cable rate patterns below this line.

# Custom parameters
**.switchBB[0].ethg$o[0].channel.datarate = 1Gbps
