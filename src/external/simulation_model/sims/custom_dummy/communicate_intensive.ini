[General]
network = ClosedQueueingNetB
*.numTandems = 8
parsim-num-partitions = 8  # set it to the same value as numTandems (1 tandem queue per process)
sim-time-limit=150s

# Statistics recording
**.vector-recording = false
# **.scalar-recording= false
# **.statistic-recording = false

# Record the response signal of every queue model for scalar file output
**.result-recording-modes = all,-vector,+histogram  # --> count,mean,max,histogram

*.tandemQueue[*].numQueues = 1000
*.sDelay = exponential(0.17299433991508684s)
*.tandemQueue[*].queue[*].numInitialJobs = 1000
*.tandemQueue[*].queue[*].serviceTime = exponential(0.34042500308902224s)
*.tandemQueue[*].qDelay = exponential(0.3867101601122578s)
*.tandemQueue[*].switch[*].retain = 1.229052871524849

# assign each tandem queue to a different processor
# (only the first n lines will be used if there are less than 15 tandem queues)
*.tandemQueue[0]**.partition-id = 0
*.tandemQueue[1]**.partition-id = 1
*.tandemQueue[2]**.partition-id = 2
*.tandemQueue[3]**.partition-id = 3
*.tandemQueue[4]**.partition-id = 4
*.tandemQueue[5]**.partition-id = 5
*.tandemQueue[6]**.partition-id = 6
*.tandemQueue[7]**.partition-id = 7
*.tandemQueue[8]**.partition-id = 8
*.tandemQueue[9]**.partition-id = 9
*.tandemQueue[10]**.partition-id = 10
*.tandemQueue[11]**.partition-id = 11
*.tandemQueue[12]**.partition-id = 12
*.tandemQueue[13]**.partition-id = 13
*.tandemQueue[14]**.partition-id = 14
*.tandemQueue[15]**.partition-id = 15

# the following lines are only needed if you want to get exactly the
# same results as in sequential simulation (they ensure a defined order
# of events with the same timestamp)
*.tandemQueue[0]**.priority = 0
*.tandemQueue[1]**.priority = 1
*.tandemQueue[2]**.priority = 2
*.tandemQueue[3]**.priority = 3
*.tandemQueue[4]**.priority = 4
*.tandemQueue[5]**.priority = 5
*.tandemQueue[6]**.priority = 6
*.tandemQueue[7]**.priority = 7
*.tandemQueue[8]**.priority = 8
*.tandemQueue[9]**.priority = 9
*.tandemQueue[10]**.priority = 10
*.tandemQueue[11]**.priority = 11
*.tandemQueue[12]**.priority = 12
*.tandemQueue[13]**.priority = 13
*.tandemQueue[14]**.priority = 14
*.tandemQueue[15]**.priority = 15
